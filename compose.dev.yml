services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: metrivo
      POSTGRES_PASSWORD: metrivo_dev_password_change_me
      POSTGRES_DB: metrivo_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - metrivo_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrivo -d metrivo_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  metrivo_dev_pgdata:
